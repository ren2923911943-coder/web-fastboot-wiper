<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ENEN WEB FLASH</title>
    <style>
        body { background-color: #0d1117; color: #c9d1d9; font-family: monospace; padding: 20px; max-width: 800px; margin: 0 auto; }
        h1 { color: #58a6ff; text-align: center; margin-bottom: 30px;}
        .panel { border: 1px solid #30363d; padding: 20px; border-radius: 8px; margin-bottom: 20px; background: #161b22; }
        .panel-title { color: #8b949e; font-size: 14px; margin-top: 0; margin-bottom: 15px; text-transform: uppercase; letter-spacing: 1px; }
        .flex-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 15px; padding-bottom: 15px; border-bottom: 1px dashed #30363d; }
        .flex-row:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
        
        button { background-color: #238636; color: white; border: none; padding: 8px 16px; font-size: 14px; border-radius: 6px; cursor: pointer; font-weight: bold; transition: 0.2s;}
        button:hover { filter: brightness(1.2); }
        button:disabled { background-color: #4b535c; cursor: not-allowed; color: #8b949e; }
        
        .danger-btn { background-color: #da3633; }
        .flash-btn { background-color: #8957e5; }
        input[type="file"] { color: #8b949e; font-family: monospace; }
        
        #log { width: 100%; height: 300px; background: #010409; color: #00ff00; border: 1px solid #30363d; padding: 10px; overflow-y: scroll; box-sizing: border-box; font-size: 13px; border-radius: 6px; margin-bottom: 10px;}
        .status-badge { display: inline-block; padding: 4px 10px; border-radius: 12px; background: #30363d; font-size: 12px; margin-left: 15px; }
        
        /* 终端输入框样式 */
        .cmd-container { display: flex; gap: 10px; }
        .cmd-input { flex: 1; background: #010409; border: 1px solid #30363d; color: #00ff00; padding: 8px 12px; border-radius: 6px; font-family: monospace; font-size: 14px; outline: none; }
        .cmd-input:focus { border-color: #58a6ff; }
        
        .promo-footer { text-align: center; margin-top: 30px; padding-top: 20px; border-top: 1px dashed #30363d; font-size: 14px; color: #8b949e; }
        .promo-footer a { color: #58a6ff; text-decoration: none; font-weight: bold; padding: 5px 10px; border-radius: 4px; transition: all 0.3s ease; display: inline-block; margin-top: 10px; background: rgba(88, 166, 255, 0.1); border: 1px solid rgba(88, 166, 255, 0.2); }
        .promo-footer a:hover { color: #ffffff; background: #58a6ff; box-shadow: 0 0 10px rgba(88, 166, 255, 0.5); }
    </style>
</head>
<body>

    <h1> WebUSB Fastboot Tool</h1>
    
    <div class="panel">
        <button id="btnConnect">连接 Fastboot 设备</button>
        <span class="status-badge" id="status">🔴 未连接</span>
    </div>

    <div class="panel">
        <h3 class="panel-title">自定义命令(CMD)</h3>
        <div class="cmd-container">
            <input type="text" id="cmdInput" class="cmd-input" placeholder="输入cmd命令 (例如: fastboot getvar:all)" disabled autocomplete="off">
            <button id="btnSendCmd" disabled>执行</button>
        </div>
    </div>

    <div class="panel">
        <h3 class="panel-title">解锁与格式化</h3>
        <div class="flex-row">
            <span>解锁bootloader和格式化设备</span>
            <div>
                <button id="btnUnlock" class="danger-btn" style="background-color: #d29922; margin-right: 10px;" disabled>解锁 BL</button>
                <button id="btnErase" class="danger-btn" disabled>一键格式化</button>
            </div>
        </div>
    </div>

    <div class="panel">
        <h3 class="panel-title">核心分区刷写</h3>
        <div class="flex-row">
            <div>
                <strong>[boot] 分区:</strong><br>
                <input type="file" id="fileBoot" accept=".img">
            </div>
            <button id="btnFlashBoot" class="flash-btn" disabled>刷入 boot</button>
        </div>
        <div class="flex-row">
            <div>
                <strong>[init_boot] 分区:</strong><br>
                <input type="file" id="fileInitBoot" accept=".img">
            </div>
            <button id="btnFlashInitBoot" class="flash-btn" disabled>刷入 init_boot</button>
        </div>
    </div>

    <div class="panel" style="text-align: right;">
        <button id="btnReboot" disabled>重启系统</button>
    </div>

    <textarea id="log" readonly>等待设备连接...</textarea>

    <div class="promo-footer">
        <p>Code with ❤️ by ENEN</p>
        <a href="https://qun.qq.com/universal-share/share?ac=1&authKey=cC8nGuTny0GTj1GlT0ybPZH5o5iNVlw8aa2olLYcxCK8oxksrJC6EaHZMIfO6Icq&busi_data=eyJncm91cENvZGUiOiI3OTgyMTI1NDIiLCJ0b2tlbiI6Ijk3dXZYVG9pQmhzTVF0OXJZRmNJWXd4VW5YemhjVUVGcnZMUWR4VU9mcDc1MGdHVE5CL3hlamJOd0dRUEwwWVEiLCJ1aW4iOiI2NTIwMzcxMTcifQ%3D%3D&data=2ZrVgeFMivCQe2j_vXOcRQCEpEuH2NjiYLzcmAXVUEins7iWEpITvUtPk8jI8C6fRiBbdYglKxhVTkEjl2Mckw&svctype=4&tempid=h5_group_info" target="_blank">👉 关注作者 / 进交流群 / 获取更多工具 👈</a>
    </div>

    <script>
        if (!navigator.usb) {
            alert("环境错误！\n必须通过 HTTPS 访问，且需使用最新版 Chrome/Edge 浏览器。");
        }

        let device = null;
        let epIn = null;
        let epOut = null;

        const ui = {
            log: document.getElementById('log'),
            status: document.getElementById('status'),
            btnConnect: document.getElementById('btnConnect'),
            btnUnlock: document.getElementById('btnUnlock'),
            btnErase: document.getElementById('btnErase'),
            btnFlashBoot: document.getElementById('btnFlashBoot'),
            btnFlashInitBoot: document.getElementById('btnFlashInitBoot'),
            btnReboot: document.getElementById('btnReboot'),
            fileBoot: document.getElementById('fileBoot'),
            fileInitBoot: document.getElementById('fileInitBoot'),
            cmdInput: document.getElementById('cmdInput'),
            btnSendCmd: document.getElementById('btnSendCmd')
        };

        function log(msg) {
            ui.log.value += `\n[${new Date().toLocaleTimeString()}] ${msg}`;
            ui.log.scrollTop = ui.log.scrollHeight;
        }

        // --- 1. USB 连接逻辑 ---
        ui.btnConnect.addEventListener('click', async () => {
            try {
                device = await navigator.usb.requestDevice({ filters: [{ classCode: 255, subclassCode: 66, protocolCode: 3 }] });
                await device.open();
                if (device.configuration === null) await device.selectConfiguration(1);

                let interfaceNumber = -1;
                for (const config of device.configurations) {
                    for (const iface of config.interfaces) {
                        for (const alt of iface.alternates) {
                            if (alt.interfaceClass === 255 && alt.interfaceSubclass === 66 && alt.interfaceProtocol === 3) {
                                interfaceNumber = iface.interfaceNumber;
                                for (const ep of alt.endpoints) {
                                    if (ep.direction === 'in') epIn = ep.endpointNumber;
                                    if (ep.direction === 'out') epOut = ep.endpointNumber;
                                }
                                break;
                            }
                        }
                    }
                }

                if (interfaceNumber === -1) throw new Error("未找到 Fastboot 接口");
                await device.claimInterface(interfaceNumber);
                
                ui.status.innerText = `🟢 已连接: ${device.productName}`;
                ui.status.style.color = '#3fb950';
                
                // 解锁 UI 按钮
                ui.btnConnect.disabled = true;
                ui.btnUnlock.disabled = false;
                ui.btnErase.disabled = false;
                ui.btnReboot.disabled = false;
                ui.cmdInput.disabled = false;
                ui.btnSendCmd.disabled = false;
                ui.fileBoot.addEventListener('change', () => ui.btnFlashBoot.disabled = !ui.fileBoot.files[0]);
                ui.fileInitBoot.addEventListener('change', () => ui.btnFlashInitBoot.disabled = !ui.fileInitBoot.files[0]);

                log(`设备连接成功！准备就绪。`);
            } catch (e) {
                log(`连接失败: ${e.message}`);
            }
        });

        // --- 2. Fastboot 指令 ---
        async function sendCommandAndRead(cmd) {
            const encoder = new TextEncoder();
            const decoder = new TextDecoder();
            await device.transferOut(epOut, encoder.encode(cmd));
            
            let finalResult = "";
            while (true) {
                const res = await device.transferIn(epIn, 64);
                const text = decoder.decode(res.data);
                log(`< 响应: ${text}`);
                
                // 如果是连续的信息输出 (如 getvar:all)，则继续拦截下一条
                if (text.startsWith("INFO")) {
                    continue; 
                }
                // 遇到状态码代表单次任务结束
                if (text.startsWith("OKAY") || text.startsWith("FAIL") || text.startsWith("DATA")) {
                    finalResult = text;
                    break;
                }
            }
            return finalResult;
        }

        // --- 3. 自定义终端逻辑 ---
        async function executeCustomCommand() {
            const rawCmd = ui.cmdInput.value.trim();
            if (!rawCmd || !device) return;
            
            // 锁定输入框防狂点
            ui.cmdInput.disabled = true;
            ui.btnSendCmd.disabled = true;
            
            try {
                log(`\n================================`);
                log(`> 尝试执行: ${rawCmd}`);
                
                let usbCmd = rawCmd;
                if (usbCmd.toLowerCase().startsWith("fastboot ")) {
                    usbCmd = usbCmd.substring(9).trim(); 
                }
                
                await sendCommandAndRead(usbCmd);
                
            } catch (e) {
                log(`指令执行异常: ${e.message}`);
            } finally {
                ui.cmdInput.value = ""; // 清空输入框
                ui.cmdInput.disabled = false;
                ui.btnSendCmd.disabled = false;
                ui.cmdInput.focus(); // 自动重新聚焦，方便连续敲代码
                log(`================================\n`);
            }
        }

        ui.btnSendCmd.addEventListener('click', executeCustomCommand);
        ui.cmdInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') executeCustomCommand();
        });

        // --- 4. 解锁 Bootloader 功能 ---
        ui.btnUnlock.addEventListener('click', async () => {
            if (!confirm("警告：解锁 Bootloader 会立刻清空所有数据并恢复出厂设置！\n\n请确保已在系统的【开发者选项】中开启了【OEM 解锁】。\n\n是否继续？")) return;
            try {
                ui.btnUnlock.disabled = true;
                log(`\n================================`);
                log(`尝试发送解锁指令...`);
                let reply = await sendCommandAndRead("flashing unlock");
                if (reply.includes("FAIL")) {
                    log(`指令被拒绝，尝试备用指令...`);
                    reply = await sendCommandAndRead("oem unlock");
                }
                if (reply.includes("OKAY")) {
                    log(`解锁指令发送成功！`);
                    log(`请查看手机屏幕，使用音量键选择确认解锁，按【电源键】确认。`);
                } else {
                    log(`❌ 设备拒绝了解锁请求。`);
                }
            } catch (e) { log(`❌ 解锁出错: ${e.message}`); } finally { ui.btnUnlock.disabled = false; log(`================================\n`); }
        });

        // --- 5. 擦除功能 (Wipe) ---
        ui.btnErase.addEventListener('click', async () => {
            if (!confirm("此操作无法撤销！确定格式化？")) return;
            try {
                ui.btnErase.disabled = true;
                log(`\n================================`);
                log(`开始格式化...`);
                await sendCommandAndRead("erase:userdata");
                await sendCommandAndRead("erase:metadata");
                try { await sendCommandAndRead("erase:cache"); } catch(e){}
                log(`格式化完毕！`);
            } catch (e) { log(`格式化出错: ${e.message}`); } finally { ui.btnErase.disabled = false; log(`================================\n`); }
        });

        // --- 6. 刷写功能 (Flash) ---
        async function flashPartition(partition, fileInfo) {
            if (!device) return;
            try {
                ui.btnErase.disabled = true; ui.btnUnlock.disabled = true;
                ui.btnFlashBoot.disabled = true; ui.btnFlashInitBoot.disabled = true;
                ui.cmdInput.disabled = true; ui.btnSendCmd.disabled = true;

                log(`\n================================`);
                log(`正在读取 ${partition} 镜像: ${fileInfo.name}...`);
                const buffer = await fileInfo.arrayBuffer();
                
                const sizeHex = buffer.byteLength.toString(16).padStart(8, '0');
                log(`申请传输通道 (大小: ${buffer.byteLength} Bytes)...`);
                
                const reply = await sendCommandAndRead(`download:${sizeHex}`);
                if (!reply.startsWith("DATA")) throw new Error("设备拒绝了传输请求");

                log(`正在加载...`);
                const chunkSize = 1024 * 1024;
                let offset = 0;
                while (offset < buffer.byteLength) {
                    const chunk = buffer.slice(offset, offset + chunkSize);
                    await device.transferOut(epOut, chunk);
                    offset += chunk.byteLength;
                }
                
                log(`校验传输完整性...`);
                const decoder = new TextDecoder();
                const res = await device.transferIn(epIn, 64);
                const checkText = decoder.decode(res.data);
                log(`< 校验响应: ${checkText}`);
                if (!checkText.startsWith("OKAY")) throw new Error("数据校验失败");

                log(`写入主板闪存...`);
                const flashReply = await sendCommandAndRead(`flash:${partition}`);
                if (flashReply.startsWith("OKAY")) { log(`[${partition}] 刷写成功！`); } else { throw new Error(`写入被拒绝: ${flashReply}`); }
            } catch (e) { log(`❌ 刷写中止: ${e.message}`); } finally {
                ui.btnErase.disabled = false; ui.btnUnlock.disabled = false;
                ui.cmdInput.disabled = false; ui.btnSendCmd.disabled = false;
                ui.btnFlashBoot.disabled = !ui.fileBoot.files[0];
                ui.btnFlashInitBoot.disabled = !ui.fileInitBoot.files[0];
                log(`================================\n`);
            }
        }

        ui.btnFlashBoot.addEventListener('click', () => flashPartition('boot', ui.fileBoot.files[0]));
        ui.btnFlashInitBoot.addEventListener('click', () => flashPartition('init_boot', ui.fileInitBoot.files[0]));
        
        // --- 7. 重启功能 ---
        ui.btnReboot.addEventListener('click', async () => {
            log(`\n正在下达重启指令...`);
            await sendCommandAndRead("reboot");
            ui.status.innerText = `🔴 设备已离线`;
            ui.status.style.color = '#8b949e';
            ui.cmdInput.disabled = true; ui.btnSendCmd.disabled = true;
        });
    </script>
</body>
</html>
